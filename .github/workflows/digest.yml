name: Daily AI News Digest

on:
  schedule:
    # 09:00, 15:00, 21:00 UTC = 06:00, 12:00, 18:00 BRT (todos os dias)
    - cron: "0 9,15,21 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo GitHub UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    environment: OPENAI_API_KEY
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose secret presence (lengths only, no values)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"
          echo "OPENAI_API_KEY length: ${#OPENAI_API_KEY}"
          echo "SMTP_USER length: ${#SMTP_USER}"
          echo "SMTP_PASSWORD length: ${#SMTP_PASSWORD}"
          echo "EMAIL_TO length: ${#EMAIL_TO}"

      - name: Run news agent
        env:
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ vars.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ vars.OPENAI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.2' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ vars.SMTP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME || 'News Agent' }}
        run: python news_agent.py
